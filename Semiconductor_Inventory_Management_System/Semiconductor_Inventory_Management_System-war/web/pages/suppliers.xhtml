<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jakarta.ee/jsf/html"
    xmlns:f="http://xmlns.jakarta.ee/jsf/core">

<h:head>
    <meta charset="UTF-8" />
    <title>Quản lý Nhà cung cấp</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 1000px; margin: auto; background: #fff; padding: 20px;
                     border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        table th, table td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        table th { background-color: #3498db; color: white; }
        table tr:nth-child(even) { background-color: #f2f2f2; }
        table tr:hover { background-color: #eaf2f8; }
        .form-section { margin-top: 30px; }
        .form-grid { display: grid; grid-template-columns: 150px 1fr; gap: 10px; margin-bottom: 15px; }
        input[type="text"] { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #27ae60; color: white; padding: 10px 18px; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #219150; }
        .back { display: inline-block; margin-bottom: 15px; color: #3498db; text-decoration: none; }
    </style>
</h:head>

<h:body>
    <div class="container">
        <h:link outcome="index" value="← Quay lại Trang chính" styleClass="back" />
        <h1>Danh sách Nhà cung cấp</h1>

        <h:dataTable value="#{supplierBean.suppliers}" var="s">
            <h:column><f:facet name="header">ID</f:facet>#{s.supplierId}</h:column>
            <h:column><f:facet name="header">Tên</f:facet>#{s.name}</h:column>
            <h:column><f:facet name="header">Email</f:facet>#{s.email}</h:column>
            <h:column><f:facet name="header">Điện thoại</f:facet>#{s.phone}</h:column>
        </h:dataTable>

        <!-- Form thêm mới -->
        <div class="form-section">
            <h2>Thêm Nhà cung cấp mới</h2>
            <h:form>
                <div class="form-grid">
                    <h:outputLabel value="Tên:" />
                    <h:inputText value="#{supplierBean.newSupplier.name}" />

                    <h:outputLabel value="Email:" />
                    <h:inputText value="#{supplierBean.newSupplier.email}" />

                    <h:outputLabel value="Điện thoại:" />
                    <h:inputText value="#{supplierBean.newSupplier.phone}" />
                </div>
                <h:commandButton value="Thêm Nhà cung cấp" action="#{supplierBean.createSupplier}" styleClass="btn" />
            </h:form>
        </div>
    </div>
</h:body>
</html>
