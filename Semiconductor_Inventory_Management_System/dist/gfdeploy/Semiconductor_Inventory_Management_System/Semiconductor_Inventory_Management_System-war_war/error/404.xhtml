<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<ui:composition template="/WEB-INF/templates/template.xhtml">
    
    <ui:define name="title">404 - Page Not Found</ui:define>
    
    <ui:define name="content">
        <div class="container-fluid">
            <div class="row justify-content-center">
                <div class="col-lg-6 col-md-8">
                    <div class="text-center">
                        <div class="error-icon mb-4">
                            <i class="fas fa-search fa-5x text-muted"></i>
                        </div>
                        
                        <h1 class="display-1 fw-bold text-primary">404</h1>
                        <h2 class="mb-4">Page Not Found</h2>
                        <p class="lead mb-4">
                            The page you are looking for doesn't exist or has been moved.
                        </p>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <h:form>
                                <h:commandButton value="Go to Dashboard" 
                                               action="#{navigationController.goToDashboard()}"
                                               styleClass="btn btn-primary btn-lg me-md-2" />
                                <h:button value="Go Back" 
                                        onclick="history.back()"
                                        styleClass="btn btn-outline-secondary btn-lg" />
                            </h:form>
                        </div>
                        
                        <div class="mt-5">
                            <h:outputText value="#{msg['error.timestamp']}: " styleClass="text-muted small" />
                            <h:outputText value="#{facesContext.externalContext.requestHeaderMap['Date']}" 
                                        styleClass="text-muted small">
                                <f:convertDateTime pattern="yyyy-MM-dd HH:mm:ss" />
                            </h:outputText>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </ui:define>
    
</ui:composition>
</html>
